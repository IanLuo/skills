name: member-exit
phase: exit
applies_when: member
order: 10
steps:
  # The member's own exit gate. It checks the process, not the outcome, and it
  # is the whole of the member's close: no teardown lives here, because the
  # member's tree is owned by the batch, not by the member. The batch's
  # batch-exit removes it once every member is integrated.
  #
  # `fs integrated $FS_NODE` exits 0 only when a done integration dispatch
  # carries this member on its own task-created payload. The check it replaces —
  # `git merge-base --is-ancestor HEAD main` — asserted an outcome, and a hand
  # merge satisfies it: it could not tell a dispatched integration from a bypass.
  # `fs integrated` is strictly stronger, so the merged-ness check is deleted
  # rather than kept beside it.
  #
  # Checks run with cwd set to the tree the member worked in — its worktree, or
  # the worker project's root when the dispatch had none — and with the closing
  # dispatch's own inputs in the environment: $FS_NODE above all, the cap node
  # being closed.
  - check: fs integrated $FS_NODE
  - ask: has this member's result been read from its worker node
