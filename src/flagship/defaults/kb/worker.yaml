name: worker
order: 10
# The standing realization: worker has no applies_when, so it matches every
# dispatch, and these two fields are how the plan resolves what runs it. engine:
# names the dispatcher; agent: names the kind of agent that carries the brief.
# A project that shadows this playbook changes the harness for that project.
engine: herdr
agent: pi
work:
  # Every worker's standing obligations, selected by every dispatch: an empty
  # applies_when matches everything, which is why this file is the one place a
  # worker's own rules live.
  #
  # These say steps were Go string literals in renderBrief until they moved here.
  # A literal in the brief renderer is a rule nobody can edit, diff or remove
  # without a release; the same words in a playbook are the user's to change, and
  # they arrive through the same plan and the same trace as every other step.
  - say: note your work on your node as you go — goal, status, the exact commands you ran, the commit — and mark it done with your evidence when you finish
  - say: your node is named in your brief. Use it; never invent one, and never write to another node
  - say: when you find work that is not yours — a gap, a broken gate, a stale fact — report it to the cap with `fs report <your project>:<your node> --question --line "<what is wrong, and where>"` and let the cap file it, rather than fixing it outside your card; the report is the obligation and the filing is not, because a gap node names the scope it belongs to, choosing that scope is a coordinating act, and a write into the cap's own scope is refused from your pane, which holds a delivery record
  - say: a claim without the command that produced it is not evidence; paste the command and its output, or say you did not run it
  - say: when a card is wrong or under-specified, say so on your node and stop — do not guess at intent, and do not widen the card to cover the guess
  - say: skills named in a `use:` step are hints, not requirements. Load the one that fits, or say why none does
  - say: report with `fs report <your project>:<your node> --line "<one line>"` when you are blocked, when you need a decision the cap has not made, or when a unit of work is finished; `--blocked`, `--question` and `--done` notify the live cap, and a report with none of them records silently for whoever reads
  - say: report whether or not a cap is live — the event is written first and always, so "recorded, not notified" is not a failed report — and keep it a pointer, never the content: under 200 bytes, a status word and one line, because the node remains the record and the cap reads the node
