name: integration
applies_when: type=integrate
order: 10
entry:
  # Integration is a dispatch too: a worker merges the batch's branches into main
  # on its own card, and the coordinator's part is to decide the order, answer
  # these asks, read the verdict on the worker's node, and close.
  #
  # This gate is member-scoped: every step is about the one member this
  # integration names. $FS_INTEGRATES is the --integrates value, so the check
  # asks about *this* integration's member and nothing else. The repo-wide greps
  # it replaces — "more than one worktree exists", "every registered branch
  # exists" — asked about the whole batch, so closing member 1's integration
  # required members 2..n to be finished first, and the gate could not be run per
  # member at all. They are deleted.
  #
  # Checks run at the project root — the main checkout — and ask fs and git,
  # never herdr: herdr resolves a workspace from the invoking pane's HERDR_*
  # environment, so a check that called it would answer about the cap's pane
  # rather than about this project.
  - check: "$FS_BIN" task get $FS_INTEGRATES --project cap --kind dispatch
  - ask: is this the next merge in order
  - ask: is main free of foreign staged changes
exit:
  # The integration's own exit gate. The suite must be green on the merged tree,
  # and the command that runs it is the project's to supply: this playbook is in
  # the binary and runs in every project, so it cannot name a path that exists in
  # one. It used to — `bash tests/run.sh` — which made this gate exit 127 and
  # refuse every integration in a repo that keeps its suite anywhere else.
  #
  # A project that has a suite checks it here by adding a playbook of its own to
  # its project scope, matching the same tags. This repo keeps one at
  # ~/.fs/projects/skills/kb/verify.yaml carrying `bash tests/run.sh`, so the gate
  # is unchanged here and unanswered elsewhere rather than wrong elsewhere.
  #
  # An integration dispatch usually names no worktree — the worker merges into
  # main — so such a check runs at the project root, the merged main checkout,
  # and that is the tree it is about. It deliberately does not ask herdr: git is
  # what owns a branch and a worktree.
  - ask: is the project's own suite green on the merged tree

  # "exactly one worktree remains" and "no unmerged local branches" are deleted:
  # both are batch-global, so they belong to no single member — a per-member
  # integration cannot satisfy them while any other member is unfinished. That is
  # what made this gate unable to run per member, and a gate that answers about
  # the batch is a gate about somebody else's dispatch.
  #
  # The six teardown steps this playbook used to share with parallel-exit are
  # gone: they now live once in batch-exit, scoped to the batch's members. An
  # integration no longer tears down a member's tree — the batch does, after
  # every member is integrated.
  - ask: was the integration verdict recorded and read
