name: batch
applies_when: type=batch
order: 10
# This dispatch leaves a kind: batch node — the fan-out's parent, which its
# members name with --batch. creates is the playbook's declaration of the node
# kind, so there is no Go map from task type to kind.
creates: batch
# The exit steps call `herdr workspace close`, so this playbook declares the
# engine its steps are written for — a plan that resolved to a different engine
# refuses rather than running a herdr command into the void.
engine: herdr
entry:
  - check: test -d .git
  # herdr resolves the workspace from the invoking pane's HERDR_* environment,
  # not from cwd — so a check that calls herdr must name its cwd explicitly, or
  # it is evaluated against the cap's pane (which need not be in a repo at all).
  - check: herdr worktree list --cwd . >/dev/null
  # The batch's cards come from the dispatch itself: fs dispatch --cards exports
  # them as $FS_CARDS, comma-separated, and this step passes them to the script
  # that intersects their declared file sets. Disjointness is therefore a
  # mechanical check on this dispatch rather than a judgement call. With no
  # --cards, check-parallel.sh refuses and names the flag — a check with no
  # input must not pass vacuously.
  #
  # This gate runs once for the fan-out — here — instead of once per member,
  # which is the whole reason the batch is a dispatched node.
  #
  # The script runs out of the binary — "$FS_BIN" script <name> $FS_CARDS — not
  # from a path in this repo: a playbook in the binary runs in every project, and
  # `bin/check-parallel.sh` resolved in exactly one. $FS_CARDS reaches it as an
  # argument like any other; fs puts it where the script reads it.
  - check: "$FS_BIN" script check-parallel.sh $FS_CARDS
  - ask: is the batch small enough that the merges are reviewable one at a time
exit:
  # The batch's gate: complete means every member integrated, read from the
  # store rather than remembered. `fs batch $FS_NODE` exits 0 iff every member
  # has a done integration dispatch naming it, and names the unintegrated ones
  # otherwise — so a batch that is not complete refuses here, before any
  # teardown runs, while its trees are still on disk to look at.
  - check: "$FS_BIN" batch $FS_NODE

  # The fan-out's teardown, declared once here and scoped to the batch's
  # members. Each step iterates the members `fs batch $FS_NODE` returns — their
  # worktree and checkout path come from their own delivery records — so this
  # single declaration replaces the byte-identical six steps that parallel-exit
  # and integration-exit each carried.
  #
  # Every step below reads the members through `jq`, and every one of them used
  # to read them as a bare pipeline: `"$FS_BIN" batch ... | jq ... | while`. That
  # is a fail-open shape, and the sharpest one here, because the failure is
  # invisible in exactly the way the steps are meant to detect. A `jq` that is
  # not on PATH prints `jq: command not found`, writes no rows, and the pipeline
  # exits with the status of the loop it never entered — 0. So the branch step
  # deleted nothing and passed, and the postconditions below CERTIFIED: a check
  # whose body never ran reports success over every member. It was found in
  # `nix build`'s check phase, where the sandbox carries git and not jq, and it
  # is the same defect the branch postcondition exists for, one layer in: a gate
  # that cannot read its input and does not say so.
  #
  # So each step reads in two assignments, and refuses on either. The first
  # captures `fs batch`'s stdout alone — its log line goes to stderr, and folding
  # that into the data would hand jq a line that is not JSON. The second pipes
  # that into jq and captures the rows, jq's own stderr included, so a refusal
  # can quote it. Both are plain `||`, not `set -o pipefail`: these steps run
  # under whatever `sh` the invoking system provides, and pipefail is a bash
  # extension — a guard that is itself a portability gamble is the same defect
  # one layer down. The rule is the one the seam for the branch decision will be
  # held to: the status that authorises a pass must not be reachable by a failure
  # to look. Nothing is forced by it — a batch whose members are all gone reads
  # fine and every loop below is a no-op — and the refusal names what could not
  # be read.
  #
  # The branch goes first, and that order is still required — though no longer
  # for the reason it once was. What forces it is the deletion: git refuses to
  # delete a branch a worktree has checked out, so the branch is freed —
  # detached where the tree is there, pruned where it is gone — before the
  # tree-removal step below runs. And deleting the branch before the tree means
  # an unmerged branch refuses the close while the tree is still on disk to look
  # at, instead of after the tree is gone and the branch is unrecoverable.
  #
  # A member's branch is freed by the same decision the code teardown makes:
  # `branch-decision.sh`, whose exit status is its answer — 0 nothing to do, 1
  # delete the branch it prints on stdout, 2 usage, 3 refuse with the reason on
  # stderr. The rule, the destructive defect it closes and the four rounds'
  # findings are written out once, in that script and its tests, rather than
  # re-derived per step. Deriving it per step is how a symlinked member came to
  # match nothing and pass in silence, and asking the directory is how a member
  # whose recorded path was not a worktree at all came back naming the project's
  # own branch and had it deleted.
  #
  # The member is passed as the script's label, so a refusal reads "member w1:
  # branch ... is not merged into HEAD" — the address of the failure — rather
  # than a reason a reader has to carry back to a member by hand.
  #
  # The member's recorded path is resolved here as well as in the decision,
  # because the act below needs a path it can hand to git and test for
  # existence, and the spelling a delivery records is not one: a path spelled
  # `$p/sub/..` is on disk while `[ -e ]` says it is not, which would prune a
  # worktree that is still there.
  #
  # Already done is not a failure: a member whose path git registers no worktree
  # at is skipped, and a worktree whose branch is already detached, deleted or
  # pruned is skipped — both are status 0, an answer that names no branch to
  # delete. Nothing is forced — a branch that is not merged into HEAD refuses
  # rather than being deleted, and a worktree git will not remove refuses —
  # because a close that destroys work to succeed is not a close worth having.
  - do: out=$("$FS_BIN" batch "$FS_NODE") || { echo "cannot read the batch's member records, so which member's branch to free cannot be told: $out" >&2; exit 1; }; rows=$(printf '%s\n' "$out" | jq -r '.data.members[] | [.worktree_path // "", .worktree // ""] | @tsv' 2>&1) || { echo "cannot read the batch's member records through jq, so which member's branch to free cannot be told: $rows" >&2; exit 1; }; printf '%s\n' "$rows" | while IFS="$(printf '\t')" read -r p ws; do [ -n "$p" ] || { [ -z "$ws" ] && continue; echo "member $ws records no path" >&2; exit 1; }; rp=$("$FS_BIN" script resolve-path.sh "$p") || { echo "cannot resolve member $ws path $p, so which worktree it names cannot be told" >&2; exit 1; }; p="$rp"; b=$("$FS_BIN" script branch-decision.sh "$p" "member $ws"); st=$?; case "$st" in 0) continue;; 1) ;; *) exit 1;; esac; if [ -e "$p" ]; then git -C "$p" checkout -q --detach && git branch -d "$b"; else git worktree prune && git branch -d "$b"; fi; done

  # Remove each member's git worktree. `git worktree remove` is the command
  # because git is what owns a worktree and its registration; a path git no
  # longer registers, or one whose directory is already gone, is the goal state
  # — `git worktree prune` clears a stale registration and exits 0. A worktree
  # git refuses to remove — a dirty checkout — is a refusal naming what git
  # said, never a silent leak.
  - do: out=$("$FS_BIN" batch "$FS_NODE") || { echo "cannot read the batch's member records, so which member's worktree to remove cannot be told: $out" >&2; exit 1; }; rows=$(printf '%s\n' "$out" | jq -r '.data.members[] | [.worktree_path // "", .worktree // ""] | @tsv' 2>&1) || { echo "cannot read the batch's member records through jq, so which member's worktree to remove cannot be told: $rows" >&2; exit 1; }; printf '%s\n' "$rows" | while IFS="$(printf '\t')" read -r p ws; do [ -n "$p" ] || { [ -z "$ws" ] && continue; echo "member $ws records no path" >&2; exit 1; }; if [ -e "$p" ]; then git worktree remove "$p"; else git worktree prune; fi; done

  # Remove each member's herdr workspace. This is the step whose absence leaked
  # wE and wG: `git worktree remove` never touches the workspace, so a fan-out
  # left one behind per member while the record said done. The command is
  # `herdr workspace close`, addressed by id. workspace_not_found is
  # already-gone (the goal state); any other failure refuses, because a
  # teardown that cannot tell gone from failed must not report success.
  - do: out=$("$FS_BIN" batch "$FS_NODE") || { echo "cannot read the batch's member records, so which member's workspace to close cannot be told: $out" >&2; exit 1; }; rows=$(printf '%s\n' "$out" | jq -r '.data.members[] | .worktree // ""' 2>&1) || { echo "cannot read the batch's member records through jq, so which member's workspace to close cannot be told: $rows" >&2; exit 1; }; printf '%s\n' "$rows" | while read -r ws; do [ -n "$ws" ] || continue; if ! out=$(herdr workspace close "$ws" 2>&1); then case "$out" in *workspace_not_found*) ;; *) echo "herdr workspace close $ws failed: $out" >&2; exit 1;; esac; fi; done

  # The postconditions. Each is about a resource the steps above claim to have
  # removed, and each fails loudly rather than trusting a return code — the
  # mistake that let a teardown report success over a checkout still on disk.
  #
  # They run after the trees are gone, so their cwd is the project root: a check
  # about a removed path has no footing inside it.
  - check: out=$("$FS_BIN" batch "$FS_NODE") || { echo "cannot read the batch's member records, so whether a member's checkout is still on disk cannot be told: $out" >&2; exit 1; }; rows=$(printf '%s\n' "$out" | jq -r '.data.members[] | .worktree_path // ""' 2>&1) || { echo "cannot read the batch's member records through jq, so whether a member's checkout is still on disk cannot be told: $rows" >&2; exit 1; }; printf '%s\n' "$rows" | while read -r p; do [ -z "$p" ] || [ ! -e "$p" ] || { echo "the checkout is still on disk at $p" >&2; exit 1; }; done

  # git's listing prints the path it resolved when the worktree was added, so the
  # recorded path is resolved first, through the same resolve-path.sh the branch
  # step uses. A miss here does not read as an error — it reads as "git no
  # longer registers it" — so a member reached by a spelling this did not fold
  # passed the check while git still had its worktree. The resolved path is read
  # into a variable of its own and named $p only once the call succeeded, so a
  # refusal can still name the path it was about instead of the empty stdout the
  # assignment would otherwise have left there.
  - check: out=$("$FS_BIN" batch "$FS_NODE") || { echo "cannot read the batch's member records, so whether git still registers a member's worktree cannot be told: $out" >&2; exit 1; }; rows=$(printf '%s\n' "$out" | jq -r '.data.members[] | .worktree_path // ""' 2>&1) || { echo "cannot read the batch's member records through jq, so whether git still registers a member's worktree cannot be told: $rows" >&2; exit 1; }; printf '%s\n' "$rows" | while read -r p; do [ -n "$p" ] || continue; rp=$("$FS_BIN" script resolve-path.sh "$p") || { echo "cannot resolve member path $p, so whether git still registers a worktree there cannot be told" >&2; exit 1; }; p="$rp"; git worktree list --porcelain | grep -qxF "worktree $p" && { echo "git still registers worktree $p" >&2; exit 1; }; done

  # The workspace check is deliberately not `! herdr workspace get`: a herdr that
  # cannot be reached is not evidence the workspace is gone, and a check that
  # passed on that would be the same fail-open gate this whole task is about. It
  # passes only on workspace_not_found, and refuses when it cannot tell.
  - check: out=$("$FS_BIN" batch "$FS_NODE") || { echo "cannot read the batch's member records, so whether a member's workspace is gone cannot be told: $out" >&2; exit 1; }; rows=$(printf '%s\n' "$out" | jq -r '.data.members[] | .worktree // ""' 2>&1) || { echo "cannot read the batch's member records through jq, so whether a member's workspace is gone cannot be told: $rows" >&2; exit 1; }; printf '%s\n' "$rows" | while read -r ws; do [ -n "$ws" ] || continue; if out=$(herdr workspace get "$ws" 2>&1); then echo "herdr still knows workspace $ws" >&2; exit 1; fi; case "$out" in *workspace_not_found*) ;; *) echo "cannot tell whether workspace $ws is gone: $out" >&2; exit 1;; esac; done

  # Every member's branch is gone — the same assertion code.yaml makes for one
  # delivery, held here over the fan-out. The batch's teardown deletes each
  # member's branch from the members' own delivery records, so a member's branch
  # surviving the batch's close is the same defect as a delivery's surviving its
  # own, over more members, and nothing asserted either one. Closing it for the
  # delivery alone would have converted an instance rather than the class: the
  # act is the same act, and the assertion belongs where the deletion is.
  #
  # Per member, and the refusal names the member. A loop that reported "a branch
  # was not deleted" over a fan-out of five would name nothing a reader could
  # act on; the member is the address of the failure, and it comes from the same
  # loop the steps above iterate rather than from a second enumeration.
  #
  # The branch comes from each member's delivery record — `fs batch` reads it
  # from there — and an empty one is skipped, which is the member whose worktree
  # its delivery did not create and whose branch was therefore never the batch's
  # to remove. Nothing is re-derived from the member's tree: the tree is what the
  # steps above just removed, and asking it would re-open the question that named
  # the wrong branch four rounds running.
  #
  # Three answers, one pass. `rev-parse --verify --quiet` exits 0 when the name
  # resolves (the branch survived; refuse), 1 when it does not, and anything else
  # when git could not be asked at all — which refuses rather than passing, the
  # same reason the workspace check above passes only on workspace_not_found.
  - check: out=$("$FS_BIN" batch "$FS_NODE") || { echo "cannot read the batch's member records, so whether a member's branch is gone cannot be told: $out" >&2; exit 1; }; rows=$(printf '%s\n' "$out" | jq -r '.data.members[] | [.node // "", .branch // ""] | @tsv' 2>&1) || { echo "cannot read the batch's member records through jq, so whether a member's branch is gone cannot be told: $rows" >&2; exit 1; }; printf '%s\n' "$rows" | while IFS="$(printf '\t')" read -r n b; do [ -n "$b" ] || continue; out=$(git rev-parse --verify --quiet "refs/heads/$b" 2>&1); st=$?; [ "$st" -eq 0 ] && { echo "branch $b still exists after the teardown of member $n — the batch's branch step skipped it, or deleted a different branch" >&2; exit 1; }; [ "$st" -eq 1 ] || { echo "cannot tell whether member $n branch $b is gone: $out" >&2; exit 1; }; done
