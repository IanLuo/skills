name: asset-3d
applies_when: asset-3d
order: 20
# The index for 3D asset work: the tools, the skills, where everything lives, what is worth
# reading, and the protocol. Selected by `--tag asset-3d`, in any project.
#
# SHIPPED DEFAULT — this file is `defaults/kb/asset-3d.yaml` in the flagship's tree and is
# embedded in the binary. A machine-local copy under `~/.fs/kb/` is an override, and one that
# restates it would be transparent. The house's own rules go in the house's own project scope
# (`~/.fs/projects/<project>/kb/`), never here.
#
# This file is deliberately an INDEX and not the law. The law is the house's contract,
# .agents/specs/asset-warehouse.md, and anything a program can enforce — units, orientation,
# a declared dimension, a missing source, a missing license — belongs in tools/check.py,
# never in prose here. A rule a program can enforce must not live in a sentence.
work:
  - say: the house is `~/Documents/apps/3d-house`, and its contract is `.agents/specs/asset-warehouse.md` — read it before making anything, because it defines what an asset IS and what the checker will refuse; this playbook is the index and the contract is the law
  - say: TOOLS, verified on this machine 2026-10-15 — blender 5.2.2 LTS headless, `nix run nixpkgs#blender -- --background --factory-startup --python <script>` (the first run fetches ~5 minutes from cache, then it is seconds); `python3`; `git`; and the flagship binary as `"$FS_BIN"`, which is the one running this plan and is NOT on PATH
  - say: NOT YET BUILT, and do not quote a command for them — `tools/generate.py`, `tools/check.py` and `tools/index.py` in the house; until one has been run, it is a plan, not a tool
  - say: SKILLS to load for this work — `specs` before changing the contract, `dev-task` for the code bar when the tools change, `review-task` when reading somebody else's asset round, `librarian` when a technique needs research (and file the answer in the library, not in your head)
  - say: ONE SKILL IS MISSING AND SHOULD EXIST, named here so it is not forgotten — `blender-3d`, which must carry the verified headless invocation, the Blender 5.x API breaks (the Action API no longer exposes `fcurves`, the compositor left `scene.node_tree`, glTF lights need `export_lights`), the render-then-look loop, and the authored-versus-interactive animation boundary; until it exists, that knowledge lives in this playbook and in the house AGENTS.md
  - say: RESOURCE LOCATIONS — the house is `~/Documents/apps/3d-house` (assets/<category>/<id>/, tools/, gallery/, INDEX.md); the worlds that consume it are `~/Documents/twilight` (game/, spec.md, spec-physics.md, architecture.md) and the world concept at `~/Documents/concepts/echo/CONCEPT.md`; the factory is `~/.fs/` (store.db, kb/, projects/<project>/kb/, traces/); and the first session's demo scripts were at `/tmp/lantern.py` and `/tmp/lantern-demo/`, which are VOLATILE and do not survive — copy anything worth keeping into the house
  - say: MANUAL LOCATIONS, offline first, because that is the only kind that answers here — Blender's own API is introspectable and answers more than any remembered doc: `blender --background --python-expr "import bpy; print(bpy.app.version_string); help(bpy.ops.export_scene.gltf)"`; the installed scripts are under `/nix/store/*blender*/share/blender/<version>/scripts/`; and the house's own docs are its spec, README.md and AGENTS.md
  - say: FETCHING IS PARTLY BLOCKED, MEASURED 2026-10-17 — `curl` returns 000 and the tool layer refuses "Blocked internal address ... 198.18.0.0/15, commonly used by TUN/fake-IP proxies", so a page cannot be fetched; but `git` over ssh to github.com works (a `git ls-remote` and a `git push` both succeeded on that date), so a repository is reachable and a web page is not. The fix for the fetch half is one line in `~/.pi/web-search.json` (`allowRanges` gaining `198.18.0.0/15`) and it is the user's call, not yours. Anything below that needed a page is still UNVERIFIED — say so when you cite one
  - say: EXTERNAL MANUALS, unverified from here — `docs.blender.org/api/current/` for the Python API, `docs.blender.org/manual/en/latest/` for the manual, `github.com/KhronosGroup/glTF` for the spec and its sample assets, `docs.godotengine.org` for importing 3D scenes into Godot
  - say: BEST PRACTICES LOCATION — the user's librarian library, which is curated and sourced, and is what to read BEFORE inventing a number: `~/Documents/librarian/library/game-dev/3d-immersive-fantasy-world-game-engines-physics-content-pipeline-2026.md`, plus `~/Documents/librarian/library/game-dev/game-dev-process-design-first-vs-engine-first-prototyping-engine-selection.md`
  - say: NUMBERS ALREADY ESTABLISHED THERE, which must not be re-guessed — mobile budgets are 80-100 draw calls, 50K-100K triangles, 128-256MB VRAM, 1-2 dynamic lights, pixel ratio capped at 1.5x; a realistic solo path is a greybox in 1-2 weeks and a polished 30-minute experience in 8-18 months; the number one mistake is scope creep and the number two is underestimating the art pipeline; and buying 80% of the art beats months of your own time
  - say: KNOWN PIPELINE HAZARDS, all from that study — Godot 4.6 has a glTF import regression that breaks vertex colouring and skeletal rigging, so check both before relying on either; glTF 2.1 is ratified (64-bit GLB, embedded thumbnails) but `KHR_physics` is still a proposal and `KHR_animation_pointer` has uneven support, so do not depend on them; Blender-to-Godot is the most mature pipeline going; and version control for binaries is Git LFS (free 1GB), with sources regenerating exports and never the reverse
  - say: VALUABLE RESOURCES, external and unverified from here, CC0 first — Kenney (40K+ assets) and Quaternius (~1,148 models) for props and characters, Poly Haven (2,200+ HDRIs, textures, models) for light and surface, Fab (Epic, licensed for any engine, bi-monthly free drops) and CGTrader Essentials for paid work, Mixamo for animation, and Meshy.ai or Rodin Gen-2.5 for rapid generated props whose license must be checked per asset and recorded in asset.json like any other
  - say: THE PROTOCOL, in order — write the parametric source FIRST, because the glb is a build product and the script is the asset; MEASURE and never declare, since asset.json records what the mesh actually is and the checker fails on a difference over 1 mm; RENDER IT AND LOOK AT THE IMAGE before you claim anything, because three faults in the first session were invisible in the code and obvious in the render and one of them was introduced by the fix itself; KEEP THE INTERACTIVE SEPARATE FROM THE AUTHORED, as a hinged window and a desk that breaks are the engine's physics and authored clips are for what moves by itself; and remember that a check which cannot fail proves nothing, which is why check.py exists
exit:
  - say: this moment is an ask rather than a check on purpose — this playbook is shipped, so it runs in every project and cannot name one repository's tooling; the house answers it with a check of its own in `~/.fs/projects/3d-house/kb/`, the way `verify.yaml` answers `integration`'s suite question
  - ask: the house's checker has passed over the whole tree, the thumbnail is newer than the glb it describes, the parametric source is committed, every new asset declares its license, and if this round changed the tools then the code bar was run and the round was reviewed
