name: code
applies_when: code
order: 10
# The exit do steps call `herdr workspace close`, so this playbook declares the
# engine its steps are written for — the constraint fs can check, so a plan that
# resolved to a different engine refuses rather than running a herdr command into
# the void.
engine: herdr
entry:
  - check: test -f AGENTS.md
  - check: grep -rl -e 'specs:locked' -e 'design:locked' --include='*.md' .
  # A locked doc is only a claim about the code at the commit it names. The step
  # above proves one exists; this one proves it is still true. Without it a spec
  # rots silently — the doc keeps reading as authoritative while the code moves
  # past it, and only a reader who diffs the two can tell. That is not a reader's
  # job, so the gate asks instead, and the cap answers one of two ways: revise
  # and re-lock (`fs dispatch --tag spec`), or proceed with --confirm, accepting
  # the delta as a recorded decision rather than an oversight.
  #
  # The script runs out of the binary — "$FS_BIN" script <name>, so there is no
  # directory it was written to and nothing on disk to go stale. It takes no
  # argument naming this repo's layout, so it asks the widest question instead:
  # has anything moved since each doc was locked. A project whose docs describe
  # one part of it narrows that with --covered, which is the caller's call
  # because the caller is what knows the repo.
  - check: "$FS_BIN" script check-specs.sh
  - ask: a locked PRD is present, and it names this one deliverable
  - ask: is the acceptance check for this deliverable stated
exit:
  # Ordinary code work's exit gate. Until this playbook existed every dev-task
  # close printed "no cleanup gate": entry was guarded, exit was not.
  #
  # The ask is the only honest check available. A clean-tree check cannot be made
  # true — the repo is routinely dirty with another agent's work — so it would be
  # a false gate; and no shell command can decide whether a node says what the
  # worker actually did. This question is the one that would have caught a worker
  # reporting a node finished when it had written nothing, which is exactly the
  # failure an exit gate exists for.
  #
  # It comes first because the teardown below destroys the tree the answer is
  # about: a question asked after the worktree is gone is a question about a
  # checkout nobody can look at any more.
  - ask: is the worker's node complete enough that nothing important died with its transcript

  # The review gate, and it sits here — after the ask, before the teardown —
  # because of what a refusal has to leave standing.
  #
  # The defect this closes is a sequencing one, and no close-time check could
  # have caught it before: `independent-review` already refuses to close until
  # every finding is dispositioned, but nothing dispatched it and nothing noticed
  # when it was skipped, so both changes in the session that found this closed
  # BEFORE any review of them was run. The review that finally ran found a severe
  # defect in one of them. A review cannot precede the close unless the close
  # asks, so the close asks — and what it asks is not "were the findings
  # dispositioned" (that gate already exists, on the review's own node) but "did
  # a review of THIS dispatch finish at all". `fs reviews` answers the second
  # question by finding a done dispatch carrying `reviews: $FS_NODE`, and its
  # refusal names the fix rather than the absence.
  #
  # A `check:`, deliberately, and not an `ask:`. An ask is a judgement the
  # mechanism cannot audit, which is the right shape for the review's own exit —
  # but this one has a record behind it, so it is decided rather than asked, and
  # --confirm cannot wave it through. The one way past it is --without-review
  # "<why>", which exports the reason as $FS_WITHOUT_REVIEW and records it on the
  # node: a skip must be visible, not impossible. The guard is read here, in one
  # visible line, the same way the teardown below reads $FS_BATCH.
  #
  # Before the teardown rather than after it, because the teardown removes the
  # very thing a review reads. A close that refused here with the worktree
  # already gone would send the cap to dispatch a review of a change that is no
  # longer on disk.
  - check: [ -n "$FS_WITHOUT_REVIEW" ] || "$FS_BIN" reviews "$FS_NODE"

  # The declared teardown. It is DECLARED, not machinery in fs close: removing a
  # tree, closing a workspace and deleting a branch differ by task type and
  # belong here — reviewable, diffable, per-type — instead of one hardcoded path
  # every type shares. This is the fix for a `dev-task --worktree` leaking its
  # checkout: nothing used to remove it at all.
  #
  # When FS_BATCH is set — this dispatch is a member of a batch — every teardown
  # step below defers: the member's tree is owned by the batch, not by the
  # member, and the batch's batch-exit removes it once every member is
  # integrated. The guard is one visible line per step, not a naming convention.
  #
  # The branch goes first, and that order is still required — though no longer
  # for the reason it once was. What forces it is the deletion: git refuses to
  # delete a branch a worktree has checked out, so the branch is freed —
  # detached where the tree is there, pruned where it is gone — before the
  # tree-removal step below runs. And deleting the branch before the tree means
  # an unmerged branch refuses the close while the tree is still on disk to look
  # at, instead of after the tree is gone and the branch is unrecoverable.
  #
  # WHAT to do with the branch is not decided here. Four rounds of fixes made
  # seven defects out of that decision, and three of them were one defect: the
  # step assembled its answer out of shell test results — a text match against
  # git's listing, then `[ -n "$b" ] || exit 0` — so "the match found nothing"
  # and "there is correctly nothing to do" were the same value, empty stdout,
  # and a branch that matched the wrong worktree was deleted. The decision now
  # lives in a shipped script, which answers in its exit status, one state per
  # status, and never in the text it prints:
  #
  #   0  nothing to do                  1  delete the branch named on stdout
  #   2  the command line was wrong     3  refuse, with the reason on stderr
  #
  # branch-decision.sh reads git's own registration and the repository's own
  # facts: which branch the worktree at $p stands on, whether that branch is
  # checked out nowhere else, whether $p is the project's own checkout or the
  # repository's main checkout, whether the branch is the repository's default,
  # and whether it is merged. The four rounds' findings are rows in that
  # script's tests rather than guards in this line.
  #
  # What is left here is the act, not the judgement: the status is read once.
  # The safety is arithmetic rather than attention — the branch name reaches
  # stdout on exactly one status and it is not 0, so a caller that ignores the
  # status has no name to delete unless this step was authorised to delete it,
  # and a caller under `set -e` aborts on the assignment and deletes nothing at
  # all. Both careless callers are tested, and the postcondition below still
  # asks whether the branch is gone: the seam must not become the only place a
  # rule lives.
  #
  # The recorded path is resolved here as well as in the decision, because the
  # act below needs a path it can hand to git and test for existence, and the
  # spelling a record carries is not one: `$p/sub/..` is a path that is on disk
  # and `[ -e ]` says it is not, which turns a live worktree into a pruned one.
  # This is the resolve-path.sh call the step has always made, in the same place
  # and with the same refusal.
  #
  # $FS_WORKTREE is the herdr workspace; $FS_WORKTREE_PATH is the checkout git
  # knows.
  - do: [ -n "$FS_BATCH" ] && exit 0; p="$FS_WORKTREE_PATH"; [ -n "$p" ] || { [ -z "$FS_WORKTREE" ] && exit 0; echo "the delivery names worktree $FS_WORKTREE but records no path" >&2; exit 1; }; rp=$("$FS_BIN" script resolve-path.sh "$p") || { echo "cannot resolve the recorded path $p, so which worktree it names cannot be told" >&2; exit 1; }; p="$rp"; b=$("$FS_BIN" script branch-decision.sh "$p"); st=$?; case "$st" in 0) exit 0;; 1) ;; *) exit 1;; esac; if [ -e "$p" ]; then git -C "$p" checkout -q --detach && git branch -d "$b"; else git worktree prune && git branch -d "$b"; fi

  # git owns the worktree and its registration; `git worktree prune` is what
  # clears a registration whose checkout is already gone. A worktree git refuses
  # to remove — a dirty checkout — refuses the close, naming what git said.
  - do: [ -n "$FS_BATCH" ] && exit 0; p="$FS_WORKTREE_PATH"; [ -n "$p" ] || { [ -z "$FS_WORKTREE" ] && exit 0; echo "the delivery names worktree $FS_WORKTREE but records no path" >&2; exit 1; }; if [ -e "$p" ]; then git worktree remove "$p"; else git worktree prune; fi

  # herdr owns the workspace, and `git worktree remove` never removes it — the
  # step that was missing when a parallel close left wE and wG behind.
  # workspace_not_found is the goal state; any other failure refuses.
  - do: [ -n "$FS_BATCH" ] && exit 0; ws="$FS_WORKTREE"; [ -n "$ws" ] || exit 0; if ! out=$(herdr workspace close "$ws" 2>&1); then case "$out" in *workspace_not_found*) exit 0;; *) echo "herdr workspace close $ws failed: $out" >&2; exit 1;; esac; fi

  # Postconditions: each asserts, after the actions, that what they removed is
  # actually gone. They run with the project root as cwd once the tree is gone,
  # because a check about a removed path has no footing inside it.
  - check: [ -n "$FS_BATCH" ] && exit 0; p="$FS_WORKTREE_PATH"; [ -z "$p" ] || [ ! -e "$p" ] || { echo "the checkout is still on disk at $p" >&2; exit 1; }

  # git prints the path it resolved, so the recorded path is resolved first —
  # the same resolve-path.sh the branch step uses, which folds a symlinked final
  # component as well as the directory above it. Comparing the raw recorded path
  # missed both, and a miss here does not read as an error: it reads as "git no
  # longer registers it", so this check passed while the worktree was still
  # registered. A gate that reports success over the thing it exists to catch is
  # worse than no gate, and that is the same defect the branch step had.
  #
  # The resolved path is read into a variable of its own and named $p only after
  # the call succeeded. Assigning it straight to $p would set $p to the empty
  # stdout the moment the call failed, and the refusal would then read "cannot
  # resolve the recorded path , so ..." — a refusal that cannot say what it was
  # about is a refusal that sends its reader looking for the path somewhere else.
  - check: [ -n "$FS_BATCH" ] && exit 0; p="$FS_WORKTREE_PATH"; [ -n "$p" ] || exit 0; rp=$("$FS_BIN" script resolve-path.sh "$p") || { echo "cannot resolve the recorded path $p, so whether git still registers a worktree there cannot be told" >&2; exit 1; }; p="$rp"; git worktree list --porcelain | grep -qxF "worktree $p" && { echo "git still registers worktree $p" >&2; exit 1; }; exit 0

  # Passes only on workspace_not_found: a herdr that cannot be reached is not
  # evidence the workspace is gone, so an unreachable herdr refuses instead of
  # passing a gate it could not evaluate.
  - check: [ -n "$FS_BATCH" ] && exit 0; ws="$FS_WORKTREE"; [ -n "$ws" ] || exit 0; if out=$(herdr workspace get "$ws" 2>&1); then echo "herdr still knows workspace $ws" >&2; exit 1; fi; case "$out" in *workspace_not_found*) exit 0;; *) echo "cannot tell whether workspace $ws is gone: $out" >&2; exit 1;; esac

  # The branch this delivery created is gone. This is the postcondition the four
  # rounds above it did not have, and its absence is why seven defects survived
  # them. The two postconditions before this one assert the tree and the
  # workspace; nothing asserted the branch, so a branch step that skipped in
  # silence — or that deleted a branch which was not the delivery's — left every
  # gate green and the branch behind, named by no record. A postcondition is not
  # a better branch step; it is the reason the close has to look.
  #
  # The branch is read from the record, never re-derived from the tree. Every
  # defect in those rounds came from naming the branch by asking a directory —
  # `git -C "$p" rev-parse` answers for the repository that ENCLOSES $p, so a
  # path that was not a worktree came back naming the project's own branch — and
  # re-deriving it here would re-open the same question at the one moment the
  # tree is gone and no directory can be asked at all. FS_BRANCH is what the
  # delivery created; git is asked only whether that name still resolves.
  #
  # Two stand-downs, and they are different facts rather than one exemption. A
  # member of a batch leaves its branch to the batch: FS_BATCH is set, and the
  # batch's own postcondition asserts every member's branch, naming the member.
  # A delivery that created no worktree — `--worktree` names one that came from
  # elsewhere — records no branch, because that branch was never this
  # delivery's to remove. An empty FS_BRANCH is how the second is told from "the
  # branch I was responsible for is still here", and the record is what makes
  # that decidable: it says which branches were ever this delivery's, so a step
  # here cannot refuse over a branch its delivery never made.
  #
  # git answers three ways and exactly one of them passes. `rev-parse --verify
  # --quiet` exits 0 when the name resolves — the branch survived, and that is
  # the refusal this step exists for — and 1 when it does not. Anything else
  # means git could not be asked (128, a repository that is not there), and that
  # refuses rather than passing: a gate that read every non-zero status as "gone"
  # would certify on a git it never reached, which is the fail-open shape the
  # workspace check above passes only workspace_not_found to avoid. The cost is
  # stated rather than hidden: if a git ever answered 128 for a missing ref
  # instead of 1, this step would refuse a check it could not evaluate — the
  # safe direction, and a refusal a reader can see, not a gate that certifies.
  - check: [ -n "$FS_BATCH" ] && exit 0; b="$FS_BRANCH"; [ -n "$b" ] || exit 0; out=$(git rev-parse --verify --quiet "refs/heads/$b" 2>&1); st=$?; [ "$st" -eq 0 ] && { echo "branch $b still exists after the teardown — the branch step skipped, or deleted a different branch" >&2; exit 1; }; [ "$st" -eq 1 ] || { echo "cannot tell whether branch $b is gone: $out" >&2; exit 1; }; exit 0
