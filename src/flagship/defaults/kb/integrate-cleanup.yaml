name: integrate-cleanup
type: cleanup
trigger: integrate
steps:
  # The integration's own exit gate. An integration dispatch names no worktree —
  # the worker merges into main — so this check runs at the project root, the
  # merged main checkout, and that is the tree it is about. It deliberately does
  # not ask herdr: git is what owns a branch and a worktree.
  #
  # The suite must be green on the merged tree. `tests/run.sh` is this repo's
  # declared suite, so it runs here rather than being taken on the worker's word.
  - check: bash tests/run.sh

  # "exactly one worktree remains" and "no unmerged local branches" are deleted:
  # both are batch-global, so they belong to no single member — a per-member
  # integration cannot satisfy them while any other member is unfinished. That is
  # what made this gate unable to run per member, and a gate that answers about
  # the batch is a gate about somebody else's dispatch. The per-member teardown
  # already removes that member's tree — fs close removes the tree the delivery
  # names, and the integration worker deletes the branch — so what stays here is
  # this integration's own outcome.
  - ask: was the integration verdict recorded and read
