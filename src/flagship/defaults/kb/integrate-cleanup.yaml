name: integrate-cleanup
type: cleanup
trigger: integrate
steps:
  # The integration's own exit gate. The suite must be green on the merged tree.
  # `tests/run.sh` is this repo's declared suite, so it runs here rather than
  # being taken on the worker's word.
  #
  # An integration dispatch usually names no worktree — the worker merges into
  # main — so the check runs at the project root, the merged main checkout, and
  # that is the tree it is about. It deliberately does not ask herdr: git is what
  # owns a branch and a worktree.
  - check: bash tests/run.sh

  # "exactly one worktree remains" and "no unmerged local branches" are deleted:
  # both are batch-global, so they belong to no single member — a per-member
  # integration cannot satisfy them while any other member is unfinished. That is
  # what made this gate unable to run per member, and a gate that answers about
  # the batch is a gate about somebody else's dispatch.
  - ask: was the integration verdict recorded and read

  # The same declared teardown the member's own cleanup declares, for the same
  # reason: whatever tree this dispatch ran in must not outlive its node, and
  # removing it is an action, not machinery. When the integration names no
  # worktree — the usual case — both steps are no-ops, which is the "already
  # done" case, not a failure.
  #
  # The branch is freed and deleted before the tree comes down, and only when it
  # is merged into HEAD; an unmerged branch refuses rather than being forced.
  - do: p="$FS_WORKTREE_PATH"; [ -n "$p" ] || { [ -z "$FS_WORKTREE" ] && exit 0; echo "the delivery names worktree $FS_WORKTREE but records no path" >&2; exit 1; }; [ -e "$p" ] || exit 0; b=$(git -C "$p" rev-parse --abbrev-ref HEAD 2>/dev/null) || { echo "cannot resolve the branch in $p" >&2; exit 1; }; [ "$b" = HEAD ] && exit 0; git merge-base --is-ancestor "$b" HEAD || { echo "branch $b is not merged into HEAD; refusing to delete it" >&2; exit 1; }; git -C "$p" checkout -q --detach && git branch -d "$b"
  - do: p="$FS_WORKTREE_PATH"; [ -n "$p" ] || { [ -z "$FS_WORKTREE" ] && exit 0; echo "the delivery names worktree $FS_WORKTREE but records no path" >&2; exit 1; }; if [ -e "$p" ]; then git worktree remove "$p"; else git worktree prune; fi
