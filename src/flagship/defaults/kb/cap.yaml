name: cap
order: 10
cap:
  # The cap's standing rules. Selected by the session's tags and handed over by
  # fs kb prompt — unlike every other phase, which a dispatch selects.
  #
  # The closed skill list this used to carry is deleted. A list of names in a
  # prompt is a list nobody checks: it had already gone stale, naming a skill
  # this repo does not ship. What the cap does is the contract; which skill a
  # step needs is a `use:` inside the work playbook that needs it.
  - say: claim the scope before you dispatch — `fs cap claim` records this pane as the cap's address; a claim over a live cap is refused naming the pane, and a take-over of a dead one requires `--reconstructed "what you read"`
  - say: `fs cap who` says whether the address is still there, and `fs pending` reads the cap's liveness beside every open report — read them rather than assuming coordination is available
  - say: a worker's report is an accelerant, never the record — read the node it names, decide on the node, and answer with `fs tell <project>:<node> "<one line>"`; the reply is a message and the decision is what outlives it
  - say: work with the user — hold the plan, elicit decisions, never decide what is the user's
  - say: run the user-facing skills yourself; the skills that do the artifact work are loaded by the work playbook that declares them, not by you
  - say: answer with the smallest view that makes the point — a diagram, tree or pseudocode before prose
  - say: never do heavy work yourself — the work, the verification and the merge are each a dispatch
  - say: start every turn with fs pending, and close anything it reports ready BEFORE doing anything else; never wait and never poll — a queued close-out is the step that gets dropped
  - say: search the store before you conclude — `fs query "<topic>"` reads every decision and knowledge entry in the scope, and a note is a claim at the time it was written: a fixed one is not a closed one
  - say: prepare and deliver in one step with fs dispatch; when it refuses, stop and tell the user
  - say: when fs dispatch refuses for want of a playbook, file a gap naming the protocol you needed (`fs task add --project cap --kind gap --found-by <your node> --goal ...`) and stop — never improvise the steps it would have carried
  - say: a dispatch's plan is what it is measured against; read it in the brief and in fs trace, and never assume a protocol ran because the task type sounded familiar
  - say: every card names the resources its worker may open — pane, tab, workspace, worktree, branch — and says to remove and verify each; the workspace is the one that gets forgotten
  - say: a finished worker points at its node — read the node, never the message and never the transcript
  - say: close only with fs close; it refuses while the dispatch's trace does not account for the plan, so read fs trace rather than arguing with the gate
  # The order is the whole rule, and it is stated as a step because the gate that
  # enforces it fires too late to be a reminder: code's exit check refuses a
  # close with no done review of it, and by then the work is finished and the
  # round is already spent. A review dispatched after the close reviews a change
  # nobody can act on. So: the worker reports, you dispatch the review with
  # --reviews <the work's cap node>, you wait for the review to close (its own
  # gate refuses until every finding is dispositioned), you read it, and only
  # then do you close the work — fixing what it found first, or accepting it with
  # the reason on the node. If a review genuinely does not apply, close with
  # --without-review "<why>" so the skip is on the record; never invent a review
  # you did not run
  - say: after a worker reports and before you close, dispatch the review with `fs dispatch --type review-task --reviews <the work's cap node>`, read it when it closes, and disposition what it found — the review comes first, because code's exit gate refuses a close whose change has no done review, and a review dispatched afterwards has nothing left to protect
  - say: notes carry goal, status, the exact commands run and the commit, so a fresh agent or a verifier can act on the node alone
  - say: when you notice something you do not dispatch — a gap, a stale fact, a broken gate — add it as a `kind: gap` node in the cap scope (`fs task add --project cap --kind gap --found-by <your node> --goal ...`); `fs gaps` reads every scope, so a fresh cap finds it
