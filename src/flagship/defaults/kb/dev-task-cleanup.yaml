name: dev-task-cleanup
type: cleanup
trigger: dev-task
steps:
  # Ordinary work's exit gate. Until this playbook existed every dev-task close
  # printed "no cleanup gate": entry was guarded, exit was not.
  #
  # It is one ask because that is the only honest step available. A clean-tree
  # check cannot be made true — the repo is routinely dirty with another agent's
  # work — so it would be a false gate; and no shell command can decide whether a
  # node says what the worker actually did. This question is the one that would
  # have caught a worker reporting a node finished when it had written nothing,
  # which is exactly the failure an exit gate exists for.
  - ask: is the worker's node complete enough that nothing important died with its transcript
