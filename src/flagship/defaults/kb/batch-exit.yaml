name: batch-exit
phase: exit
applies_when: batch
order: 10
# The do steps call `herdr workspace close`, so this playbook declares the
# engine its steps are written for — the constraint fs can check, so a plan that
# resolved to a different engine refuses rather than running a herdr command
# into the void.
engine: herdr
steps:
  # The batch's gate: complete means every member integrated, read from the
  # store rather than remembered. `fs batch $FS_NODE` exits 0 iff every member
  # has a done integration dispatch naming it, and names the unintegrated ones
  # otherwise — so a batch that is not complete refuses here, before any
  # teardown runs, while its trees are still on disk to look at.
  - check: fs batch $FS_NODE

  # The fan-out's teardown, declared once here and scoped to the batch's
  # members. Each step iterates the members `fs batch $FS_NODE` returns — their
  # worktree and checkout path come from their own delivery records — so this
  # single declaration replaces the byte-identical six steps that parallel-exit
  # and integration-exit each carried.
  #
  # The branch goes first, and that order is required: a worktree's branch can
  # only be named while the worktree exists, and detaching it is the only way to
  # free a branch another worktree has checked out. Deleting it before the tree
  # means an unmerged branch refuses the close while the tree is still on disk to
  # look at, instead of after the tree is gone and the branch is unrecoverable.
  #
  # Already done is not a failure: with no worktree the member is skipped, and a
  # worktree whose branch is already detached or deleted is skipped. Nothing is
  # forced — a branch that is not merged into HEAD refuses rather than being
  # deleted, and a worktree git will not remove refuses — because a close that
  # destroys work to succeed is not a close worth having.
  - do: fs batch "$FS_NODE" | jq -r '.data.members[] | [.worktree_path // "", .worktree // ""] | @tsv' | while IFS="$(printf '\t')" read -r p ws; do [ -n "$p" ] || { [ -z "$ws" ] && continue; echo "member $ws records no path" >&2; exit 1; }; [ -e "$p" ] || continue; b=$(git -C "$p" rev-parse --abbrev-ref HEAD 2>/dev/null) || { echo "cannot resolve the branch in $p" >&2; exit 1; }; [ "$b" = HEAD ] && continue; git merge-base --is-ancestor "$b" HEAD || { echo "branch $b is not merged into HEAD; refusing to delete it" >&2; exit 1; }; git -C "$p" checkout -q --detach && git branch -d "$b"; done

  # Remove each member's git worktree. `git worktree remove` is the command
  # because git is what owns a worktree and its registration; a path git no
  # longer registers, or one whose directory is already gone, is the goal state
  # — `git worktree prune` clears a stale registration and exits 0. A worktree
  # git refuses to remove — a dirty checkout — is a refusal naming what git
  # said, never a silent leak.
  - do: fs batch "$FS_NODE" | jq -r '.data.members[] | [.worktree_path // "", .worktree // ""] | @tsv' | while IFS="$(printf '\t')" read -r p ws; do [ -n "$p" ] || { [ -z "$ws" ] && continue; echo "member $ws records no path" >&2; exit 1; }; if [ -e "$p" ]; then git worktree remove "$p"; else git worktree prune; fi; done

  # Remove each member's herdr workspace. This is the step whose absence leaked
  # wE and wG: `git worktree remove` never touches the workspace, so a fan-out
  # left one behind per member while the record said done. The command is
  # `herdr workspace close`, addressed by id. workspace_not_found is
  # already-gone (the goal state); any other failure refuses, because a
  # teardown that cannot tell gone from failed must not report success.
  - do: fs batch "$FS_NODE" | jq -r '.data.members[] | .worktree // ""' | while read -r ws; do [ -n "$ws" ] || continue; if ! out=$(herdr workspace close "$ws" 2>&1); then case "$out" in *workspace_not_found*) ;; *) echo "herdr workspace close $ws failed: $out" >&2; exit 1;; esac; fi; done

  # The postconditions. Each is about a resource the steps above claim to have
  # removed, and each fails loudly rather than trusting a return code — the
  # mistake that let a teardown report success over a checkout still on disk.
  #
  # They run after the trees are gone, so their cwd is the project root: a check
  # about a removed path has no footing inside it.
  - check: fs batch "$FS_NODE" | jq -r '.data.members[] | .worktree_path // ""' | while read -r p; do [ -z "$p" ] || [ ! -e "$p" ] || { echo "the checkout is still on disk at $p" >&2; exit 1; }; done

  # git's listing prints the path it resolved when the worktree was added, so the
  # recorded path is resolved through its parent first: on macOS /tmp and /var
  # are symlinks, and comparing the raw recorded path would miss a registration
  # git lists under /private/....
  - check: fs batch "$FS_NODE" | jq -r '.data.members[] | .worktree_path // ""' | while read -r p; do [ -n "$p" ] || continue; d=$(cd "$(dirname "$p")" 2>/dev/null && pwd -P) && p="$d/$(basename "$p")"; git worktree list --porcelain | grep -qxF "worktree $p" && { echo "git still registers worktree $p" >&2; exit 1; }; done

  # The workspace check is deliberately not `! herdr workspace get`: a herdr that
  # cannot be reached is not evidence the workspace is gone, and a check that
  # passed on that would be the same fail-open gate this whole task is about. It
  # passes only on workspace_not_found, and refuses when it cannot tell.
  - check: fs batch "$FS_NODE" | jq -r '.data.members[] | .worktree // ""' | while read -r ws; do [ -n "$ws" ] || continue; if out=$(herdr workspace get "$ws" 2>&1); then echo "herdr still knows workspace $ws" >&2; exit 1; fi; case "$out" in *workspace_not_found*) ;; *) echo "cannot tell whether workspace $ws is gone: $out" >&2; exit 1;; esac; done
