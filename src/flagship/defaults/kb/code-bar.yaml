name: code-bar
applies_when: code
order: 30
# The code bar in one file. Three playbooks used to carry it — `development`
# (order 30), `tdd` (40) and `review` (50) — and each ended with the same
# hint naming `dev-task` under a different when-clause, so every code dispatch
# named one skill three times and kept the bar in three files to edit.
#
# They are folded here. Every say step of the three is kept, in the order a
# worker was already handed them: development's six, then tdd's four, then
# review's four. The three hints are one, carrying all three clauses. Nothing
# was added, and the three files are deleted rather than emptied, so the shipped
# set is genuinely smaller.
#
# order 30 is the slot the first of the three occupied, and that is what the
# merge preserves: the work steps reach a worker in plan order — worker (10),
# plan (20), then this — which is the sequence the three produced, so what an
# agent is told to do is unchanged. Another order would reorder the brief for no
# gain.
#
# The three also carried the bar at three moments — before writing
# (development), through red and green (tdd), and on the finished diff
# (review) — and the comments below keep that shape in the steps' order.
#
# Not to be confused with `independent-review`: that one is another
# participant, loads only into a `--type review-task` dispatch, and reads
# somebody else's change. The self-review at the end of this file reads your
# own.
work:
  # The code bar proper: the rules a reviewer would apply to your diff, put
  # where the person writing the diff reads them.
  - say: write the smallest structure that solves the problem — no abstraction for a single caller, no configuration nobody asked for
  - say: make surgical changes: every changed line traces to the card, and no adjacent code is "improved" on the way past
  - say: match the surrounding style, even where you would do it differently; consistency beats preference in someone else's file
  - say: own only the orphans your change creates; report pre-existing dead code rather than deleting it
  - say: do a refactor as its own step, with its own verification, never folded into a change that was supposed to do something else
  - say: no new dependency without saying why an existing one will not do

  # The loop. "When a test is skipped, record why" is here because a skipped
  # test is the quietest way to make a red suite green, and the record is the
  # only thing that distinguishes a deliberate skip from a hidden failure.
  - say: characterise the current behaviour with a failing test before you change it — red first, and see it fail for the reason you expect
  - say: make it pass with the narrowest change that does; resist fixing anything the failing test did not ask about
  - say: run the broader check after green — the package, then the suite — because a local pass is not a suite pass
  - say: when you skip or disable a test, record why on your node; an unexplained skip is a failure with better manners

  # Self-review before the claim. It is last because it is the last thing you do
  # before saying the work is done, and it is the only step whose input is your
  # own diff rather than the card.
  - say: re-read your whole diff against the code bar before you claim done — not the files you remember changing, the diff
  - say: check the diff for what the card did not ask for; unrequested changes are the ones a reviewer cannot interpret
  - say: record what the review flagged and what you did about each item, on your node
  - say: say plainly what you did not verify and why; an honest gap is reviewable, a confident guess is not

  # One hint, where there were three. Each of the three clauses was the reason
  # its own file named the skill, and the surviving line carries all three: the
  # bar, the red/green loop, and the review loop as this project runs them.
  - use: dev-task — the code bar, the red/green loop and the review loop this project holds itself to
