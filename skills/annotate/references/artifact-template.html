<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>artifact</title>
<!-- Chrome is inlined at build time (scripts/build-artifact.py) — the AI writes only
     the content. Keep __CHROME_CSS__ / __CHROME_JS__ placeholders exactly as-is. -->
<style>
/*__CHROME_CSS__*/
</style>
</head>
<body>

<!-- ============================================================
     AI: render the data below. Every element the user might
     comment on gets a STABLE, kebab-case data-anchor id, e.g.
     data-anchor="section-goals". Clicking an element opens an
     inline feedback box right there. Do not change anchor ids
     between iterations — the pasted feedback resolves by id.

     Put the id on the UNIT the reader points at — a heading, a
     paragraph, a list item, a table row, a callout. Never on a
     wrapper (<section>, a card, a column) that holds several:
     clicking walks up to the nearest id, so a container id makes
     the whole container one target and the reader cannot point at
     a line. build-artifact.py rejects a container anchor.

     Optional blueprint decoration classes:
     <p class="kicker">Figure 1 · the mechanism</p> above a heading,
     <p class="eyebrow">…</p> above the title, a mono status line as
     <div class="meta-row"><span><b>N</b> items</span><span class="sep">·</span>…</div>,
     and .card for a boxed block.

     Write arrows as → (U+2192), never as the emoji ➡️: the emoji renders as a
     monochrome tofu box in IBM Plex body text, and a page full of boxes reads as broken.

     ── A ROUND OF DECISIONS (specs re-grill, option pages) ──────
     When the reader is choosing between answers rather than commenting, give each
     decision a rung: a wrapper, an anchored heading, and one .answers group. One
     click then records the answer, and the rail counts what is left.

       <section class="rung" data-rung="r3-scope">
         <h3 data-anchor="r3-scope">R3 · Scope in / out</h3>
         <div class="rung-body">
           <p data-anchor="r3-scope-q">V1 ships X. Not Y · ➡️ X only.</p>
           <p data-anchor="r3-scope-cost">If wrong: R4 gains two criteria.</p>
         </div>
         <div class="answers" data-for="r3-scope">
           <button data-choice="accept">Accept →</button>
           <button data-choice="B">B · narrower V1</button>
           <button data-choice="other">Other…</button>
         </div>
       </section>

     data-rung and data-for must name the heading's data-anchor — a group that
     points nowhere records a click against nothing, and build-artifact.py refuses
     it. Keep the wrapper bare: it is not a click target, the heading is.

     ── ANSWERING A PREVIOUS ROUND ────────────────────────────────
     If this artifact answers notes from an earlier round, do NOT
     paraphrase them into prose — the reader cannot tell their words
     from yours, and "where is the answer?" is the failure this
     vocabulary exists to prevent. Quote each note VERBATIM and pair
     it with your answer as one thread:

       <div class="ev user" data-thread="r1e" data-anchor="r1e">
         <span class="who">you</span>
         <div class="txt">edit or create? (the note, verbatim)</div></div>
       <div class="ev agent" data-thread="r1e" data-anchor="r1e-answer"
            data-status="new">
         <span class="who">me</span>
         <div class="txt">Both — the lease is on the topic…</div></div>

     data-thread is the pairing key and must be the note's original
     anchor id. The user row keeps that id as its data-anchor so notes
     survive every round. The agent row takes data-anchor too, so the
     next round can annotate the answer. Both rows are required.

     ── WHAT IS FRESH ─────────────────────────────────────────────
     Mark it, or the reader sees one undifferentiated wall of text.
     Put the round's delta in the opening meta-row, then per element:

       data-status="new"     first appearance this round
       data-status="changed" revised since the last round
       data-status="settled" carried over, unchanged (recedes)
       data-status="open"    awaiting the reader's decision

     On a .ev row the state appears beside the voice label; on any
     other element it renders as a pill. For a round or section
     heading use <span class="secpill new">3 new</span>. A row with no
     data-status is treated as settled.

     ── RETIRING A NOTE ───────────────────────────────────────────
     A thread that is finished may be dropped, but silently, never:
     list its ids on the round wrapper — data-retired="r1a,r1b" — so
     build-artifact.py --prev can prove nothing was lost.
     ============================================================ -->

<h1 data-anchor="title">…</h1>

<div id="rail" hidden>
  <span id="rail-count"></span>
  <button id="rail-next">next open →</button>
</div>

<!-- Chrome markup — already in the template. A content file must NOT copy this
     block: the page would carry every id twice, chrome.js would bind to the first
     copy and the reader would click the second, so Done would do nothing. -->
<button id="done">Done · <span id="count">0</span></button>
<div id="status"></div>

<div id="form" hidden>
  <div class="head">Feedback</div>
  <div class="body">
    <div id="list"></div>
    <textarea id="comment" rows="3" placeholder="Feedback at this spot…"></textarea>
    <div id="levels">
      <button class="lvl active" data-sev="suggestion">suggestion</button>
      <button class="lvl" data-sev="important">important</button>
      <button class="lvl" data-sev="critical">critical</button>
    </div>
    <div class="actions"><button id="add">Add</button><button id="cancel">Cancel</button></div>
  </div>
</div>

<script>
//__CHROME_JS__
</script>
</body>
</html>
