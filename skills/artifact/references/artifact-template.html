<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>artifact</title>
<!-- Static chrome — NOT generated per artifact. Copy chrome.css + chrome.js from the
     skill's references/ into the artifact dir once per project, then reference them. -->
<link rel="stylesheet" href="chrome.css">
</head>
<body>

<!-- ============================================================
     AI: render the data below. Every element the user might
     comment on gets a STABLE, kebab-case data-anchor id, e.g.
     data-anchor="section-goals". Clicking an element opens an
     inline feedback box right there. Do not change anchor ids
     between iterations — the pasted feedback resolves by id.
     ============================================================ -->

<h1 data-anchor="title">…</h1>

<!-- Required chrome markup — keep verbatim. -->
<button id="done">Done · <span id="count">0</span></button>
<span id="raw" title="Copy as raw JSON">raw</span>
<div id="status"></div>

<div id="form" hidden>
  <div class="head">Feedback</div>
  <div class="body">
    <textarea id="comment" rows="3" placeholder="Feedback at this spot…"></textarea>
    <div id="levels">
      <button class="lvl active" data-sev="suggestion">suggestion</button>
      <button class="lvl" data-sev="important">important</button>
      <button class="lvl" data-sev="critical">critical</button>
    </div>
    <div class="actions"><button id="add">Add</button><button id="cancel">Cancel</button></div>
  </div>
</div>

<script src="chrome.js"></script>
</body>
</html>
